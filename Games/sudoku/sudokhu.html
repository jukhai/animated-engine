<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Sudoku Puzzle</title>
  <style>
    table {
      border-collapse: collapse;
      margin: 20px auto;
    }
    td {
      border: 1px solid #999;
      width: 40px;
      height: 40px;
      text-align: center;
    }
    input {
      width: 38px;
      height: 38px;
      font-size: 18px;
      text-align: center;
      border: none;
    }
    td.box-border {
      border-right: 2px solid black;
      border-bottom: 2px solid black;
    }
    td.box-left {
      border-left: 2px solid black;
    }
    td.box-top {
      border-top: 2px solid black;
    }
    button {
      display: block;
      margin: 10px auto;
    }
  </style>
</head>
<body>

<h2 style="text-align:center">Sudoku Puzzle</h2>
<div id="sudokuContainer" style="text-align:center;"></div>
<button onclick="checkSolution()">Check Solution</button>
<div id="result" style="text-align:center; font-weight:bold;"></div>

<script>
const N = 9;
const BOX = 3;

function generateEmptyBoard() {
  return Array.from({ length: N }, () => Array(N).fill(0));
}

function isSafe(board, row, col, num) {
  for (let i = 0; i < N; i++) {
    if (board[row][i] === num || board[i][col] === num) return false;
  }
  const boxRow = row - row % BOX;
  const boxCol = col - col % BOX;
  for (let i = 0; i < BOX; i++) {
    for (let j = 0; j < BOX; j++) {
      if (board[boxRow + i][boxCol + j] === num) return false;
    }
  }
  return true;
}

function solve(board) {
  for (let row = 0; row < N; row++) {
    for (let col = 0; col < N; col++) {
      if (board[row][col] === 0) {
        const nums = shuffle([...Array(N).keys()].map(x => x + 1));
        for (const num of nums) {
          if (isSafe(board, row, col, num)) {
            board[row][col] = num;
            if (solve(board)) return true;
            board[row][col] = 0;
          }
        }
        return false;
      }
    }
  }
  return true;
}

function shuffle(arr) {
  for (let i = arr.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [arr[i], arr[j]] = [arr[j], arr[i]];
  }
  return arr;
}

function removeCells(board, count) {
  let removed = 0;
  while (removed < count) {
    const row = Math.floor(Math.random() * N);
    const col = Math.floor(Math.random() * N);
    if (board[row][col] !== 0) {
      board[row][col] = 0;
      removed++;
    }
  }
  return board;
}

const solution = generateEmptyBoard();
solve(solution);
const puzzle = solution.map(row => [...row]);
removeCells(puzzle, 40); // adjust for difficulty

function createSudokuGrid(board) {
  const container = document.getElementById("sudokuContainer");
  const table = document.createElement("table");

  for (let i = 0; i < N; i++) {
    const row = document.createElement("tr");
    for (let j = 0; j < N; j++) {
      const cell = document.createElement("td");

      // Add box borders
      if ((j + 1) % 3 === 0 && j < 8) cell.classList.add("box-border");
      if (j % 3 === 0) cell.classList.add("box-left");
      if (i % 3 === 0) cell.classList.add("box-top");

      const input = document.createElement("input");
      input.setAttribute("maxlength", 1);
      input.setAttribute("data-row", i);
      input.setAttribute("data-col", j);

      if (board[i][j] !== 0) {
        input.value = board[i][j];
        input.disabled = true;
        input.style.background = "#eee";
        input.style.fontWeight = "bold";
      }

      cell.appendChild(input);
      row.appendChild(cell);
    }
    table.appendChild(row);
  }
  container.appendChild(table);
}

function checkSolution() {
  let correct = true;
  for (let i = 0; i < N; i++) {
    for (let j = 0; j < N; j++) {
      const input = document.querySelector(`input[data-row='${i}'][data-col='${j}']`);
      const val = parseInt(input.value);
      if (val !== solution[i][j]) {
        input.style.color = "red";
        correct = false;
      } else {
        input.style.color = "black";
      }
    }
  }
  document.getElementById("result").innerText = correct ? "✅ Correct!" : "❌ Try again.";
}

// Render puzzle
createSudokuGrid(puzzle);
</script>

</body>
</html>
